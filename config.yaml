# DexScreener Bot Configuration
# Fill in your secrets. Never commit real tokens.

# --- APIs ---
dexscreener:
  base_url: "https://api.dexscreener.com"
  chain: "solana"
  poll_interval_seconds: 60          # normal mode interval
  rate_limit_delay: 0.25             # seconds between requests (stay under 300/min)

# --- Sniper mode (aggressive new-pair detection) ---
# Set runtime.mode: "sniper" to use this path instead of the slower discovery cycle.
sniper:
  enabled: true
  poll_interval_seconds: 4.0         # how often to hit latest token profiles
  rate_limit_delay: 0.12             # tighter delay for aggressive polling
  max_age_seconds: 180               # only consider pairs younger than this (3 min)
  max_candidates_per_cycle: 12       # hard cap per scan to stay under rate limits
  seen_ttl_seconds: 600              # remember a mint for 10 min (avoid re-processing)
  min_liquidity_usd: 5000            # soft pre-filter before full pipeline
  prefer_dexes:                      # prioritise these DEXes
    - raydium
    - pumpswap
    - pumpfun
    - meteora

rugcheck:
  base_url: "https://api.rugcheck.xyz"
  only_good: true                    # Good band: riskLevel good, or raw score < 1000 when level is absent
  reject_on_bundle: true             # skip danger-level bundle/insider flags
  max_real_top10_pct: 60             # skip (do not blacklist) when real holders, pools excluded, exceed this

# Pocket Universe style fake-volume heuristic (no public API; we approximate)
fake_volume:
  enabled: true
  # Heuristics: high volume with very low unique makers or extreme buy/sell imbalance
  min_volume_usd_for_check: 50000
  max_unique_makers_ratio: 0.05      # if unique txns / volume too low → suspicious
  extreme_buy_sell_ratio: 0.95       # >95% buys or sells → possible wash

# --- Filters (applied before deep checks) ---
filters:
  min_liquidity_usd: 8000
  min_volume_24h_usd: 15000
  min_market_cap_usd: 0
  max_market_cap_usd: 5000000
  max_age_minutes: 180               # only consider pairs younger than this (normal mode)
  require_socials: false

# --- Older-token scan (DexScreener boosts + optional explicit Solana mints) ---
older_tokens:
  enabled: true                      # disabled automatically when runtime.mode = sniper
  scan_latest_boosts: true
  scan_top_boosts: true
  mints: []                         # add established Solana mints for continuous monitoring
  max_pairs_per_cycle: 20
  min_age_minutes: 180              # starts where filters.max_age_minutes ends; no 3h–7d gap
  max_market_cap_usd: 0             # 0 = no cap once a spike or breakout qualifies; new pairs stay at $5M
  liquidity_lookback_minutes: 60    # first liquidity-spike signal needs a full lookback to warm up
  liquidity_spike_pct: 30           # require this rise versus the stored lookback observation
  min_baseline_liquidity_usd: 5000  # ignore tiny baselines that can create misleading percentages
  breakout_price_change_1h_pct: 20
  min_volume_1h_usd: 25000           # applies to liquidity spikes and price breakouts

# --- Blacklists (JSON files, auto-created) ---
blacklists:
  coins_file: "data/coin_blacklist.json"
  devs_file: "data/dev_blacklist.json"
  auto_add_fake_volume: false       # skip the pass, but do not permanently ban a wash heuristic
  auto_add_bundles: false           # danger bundle/insider still skips; ban only when this is true
  auto_add_rugs: true

# --- Analysis thresholds ---
analysis:
  rug_price_drop_1h_pct: -40         # < -40% in 1h + low liq → rug signal
  pump_price_rise_1h_pct: 80         # > +80% in 1h + volume → pump signal
  save_all_new_pairs: true
  save_rugs: true
  save_pumps: true

# --- Trading via Bonkbot (Telegram) ---
telegram:
  enabled: true
  bot_token: "YOUR_TELEGRAM_BOT_TOKEN"          # BotFather token of YOUR bot
  chat_id: "YOUR_CHAT_ID"                       # where you want notifications + commands
  # How to trade: send a message that Bonkbot understands.
  # Common pattern: paste the mint address (Bonkbot auto-detects) or use /buy
  buy_command_template: "{mint}"                # just the CA is often enough
  # Alternative examples:
  # buy_command_template: "/buy {mint} 0.1"
  # buy_command_template: "buy {mint} 0.05 SOL"
  default_buy_sol: 0.05                         # only shown in dry-run messages when no SOL price is available
  # Exit signals. Empty = notify only ("SELL NOW"), you sell by hand. The trading bot's sell
  # syntax is not verified here, so set this only after testing it, e.g. "/sell {mint} 100%".
  sell_command_template: ""
  notify_on_buy: true
  notify_on_sell: true
  notify_on_rug: true
  notify_on_pump: true
  notify_on_blacklist: true

# --- Risk engine (paper book that gates every buy and runs every exit) ---
risk:
  start_cash: 1000              # USD bankroll the book models. Set it to what you really risk.
  max_positions: 4
  max_position_pct: 0.08        # share of equity per name at full conviction
  min_notional: 25              # skip tickets smaller than this
  fee_rate: 0.003               # per side; tune to your real DEX + trading-bot fees
  hard_stop: -0.06
  trail_arm: 0.12               # trail only arms after this gain...
  trail_give: 0.06              # ...then exits after giving back this much from the peak
  revenge_lock_s: 43200         # no re-entry on a mint for 12h after a losing exit
  daily_loss_pct: 0.05          # halt new entries after losing 5% of day-start equity
  min_score: 0.45               # analyst line (same as the TypeScript live desk)
  slippage_bps: 100             # base slippage for paper fills, on top of pool impact
  impact_factor: 1.0            # 1.0 = constant-product pool impact (2*ticket/liquidity)
  stale_exit_s: 1800            # no price for this long -> write the position off at zero

# --- Ledger (every decision, plus counterfactual re-checks of the names we turned away) ---
ledger:
  db_file: "data/ledger.db"
  book_file: "data/book.json"
  horizons_s: [3600, 86400]     # re-price rejected names after 1h and 24h
  block_cooldown_s: 21600       # log the same (token, rule) at most once per 6h
  dead_after_s: 259200          # a token with no price 3 days past its check counts as -100%

# --- Storage ---
storage:
  db_file: "data/tokens.db"
  analysis_jsonl: "data/analysis.jsonl"

# --- Runtime ---
runtime:
  mode: "sniper"                     # "normal" | "sniper"
  dry_run: true                      # true = never send real buy commands
  max_pairs_per_cycle: 30
  log_level: "INFO"
